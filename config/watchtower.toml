[general]
max_seen_per_source = 3000

[notifications]
# Teams is the default. Change to "slack" only when required.
provider = "teams"

# All sources are disabled until placeholder values have been replaced.
# An enabled source containing REPLACE_ME will fail validation instead of running silently.

[[source]]
id = "regjeringen"
kind = "regjeringen"
label = "Regjeringen"
enabled = false
alert_on_update = true
[source.filter]
include_any = [
  "REPLACE_ME_TOPIC_1",
  "REPLACE_ME_ORGANISATION_1",
]
exclude_any = []

[[source]]
id = "stortinget"
kind = "stortinget"
label = "Stortinget"
enabled = false
alert_on_update = false
datasets = ["saker", "skriftligesporsmal", "horinger"]
[source.filter]
include_any = [
  "REPLACE_ME_TOPIC_1",
  "REPLACE_ME_PERSON_1",
]
exclude_any = []

[[source]]
id = "konkurransetilsynet"
kind = "konkurransetilsynet"
label = "Konkurransetilsynet"
enabled = false
alert_on_update = true
[source.filter]
include_any = [
  "REPLACE_ME_COMPANY_1",
]
exclude_any = []

[[source]]
id = "euronext"
kind = "euronext"
label = "Euronext"
enabled = false
alert_on_update = false
# Add one or more Euronext company-information URLs before enabling this source.
urls = []
[source.filter]
include_any = [
  "REPLACE_ME_COMPANY_1",
]
exclude_any = [
  "invitasjon til resultatpresentasjon",
  "ex. utbytte",
  "generalforsamling",
  "finansiell kalender",
]

[[source]]
id = "hoyesterett"
kind = "hoyesterett"
label = "Høyesterett"
enabled = false
alert_on_update = false
max_items = 80
[source.filter]
include_any = [
  "REPLACE_ME_LEGAL_TOPIC_1",
]
exclude_any = []

[[source]]
id = "doffin"
kind = "doffin"
label = "Doffin"
enabled = false
alert_on_update = true
page_size = 100
max_pages = 1
search_queries = [
  "REPLACE_ME_BUYER_OR_TOPIC_1",
]
[source.filter]
include_any = [
  "REPLACE_ME_BUYER_OR_TOPIC_1",
]
exclude_any = []

[[source]]
id = "brreg"
kind = "brreg"
label = "Brønnøysundregistrene"
enabled = false
alert_on_update = true
# Replace with one or more valid 9-digit organisation numbers before enabling.
companies = [
  "REPLACE_ME_ORGNR_1",
]
events = [
  "annual_accounts",
  "company",
  "roles",
]
[source.filter]
# BRREG already limits results to companies above, so no duplicate filter list is required.
match_all = true
exclude_any = []
