[general]
max_seen_per_source = 3000

# Scheduleren starter monitor-workflowen omtrent hvert femte minutt. En kilde
# hentes først når intervallet har gått; standarden er 60 minutter og minste
# tillatte verdi er 5.

[notifications]
# Teams is the default. Change to "slack" only when required.
provider = "teams"

# All sources are disabled until placeholder values have been replaced.
# An enabled source containing REPLACE_ME will fail validation instead of running silently.

[[source]]
id = "regjeringen"
kind = "regjeringen"
label = "Regjeringen"
enabled = false
interval_minutes = 60
alert_on_update = true
[source.filter]
include_any = [
  "REPLACE_ME_TOPIC_1",
  "REPLACE_ME_ORGANISATION_1",
]
exclude_any = []

[[source]]
id = "stortinget"
kind = "stortinget"
label = "Stortinget"
enabled = false
interval_minutes = 60
alert_on_update = false
datasets = ["saker", "skriftligesporsmal", "horinger"]
[source.filter]
include_any = [
  "REPLACE_ME_TOPIC_1",
  "REPLACE_ME_PERSON_1",
]
exclude_any = []

[[source]]
id = "konkurransetilsynet"
kind = "konkurransetilsynet"
label = "Konkurransetilsynet"
enabled = false
interval_minutes = 60
alert_on_update = true
[source.filter]
include_any = [
  "REPLACE_ME_COMPANY_1",
]
exclude_any = []

[[source]]
id = "euronext"
kind = "euronext"
label = "Euronext"
enabled = false
interval_minutes = 60
alert_on_update = false
# Add one or more Euronext company-information URLs before enabling this source.
urls = []
[source.filter]
include_any = [
  "REPLACE_ME_COMPANY_1",
]
exclude_any = [
  "invitasjon til resultatpresentasjon",
  "ex. utbytte",
  "generalforsamling",
  "finansiell kalender",
]

[[source]]
id = "hoyesterett"
kind = "hoyesterett"
label = "Høyesterett"
enabled = false
interval_minutes = 60
alert_on_update = false
max_items = 80
[source.filter]
include_any = [
  "REPLACE_ME_LEGAL_TOPIC_1",
]
exclude_any = []

[[source]]
id = "doffin"
kind = "doffin"
label = "Doffin"
enabled = false
interval_minutes = 60
alert_on_update = true
page_size = 100
max_pages = 1
search_queries = [
  "REPLACE_ME_BUYER_OR_TOPIC_1",
]
[source.filter]
include_any = [
  "REPLACE_ME_BUYER_OR_TOPIC_1",
]
exclude_any = []

[[source]]
id = "brreg"
kind = "brreg"
label = "Brønnøysundregistrene"
enabled = false
interval_minutes = 60
alert_on_update = true
# Replace with one or more valid 9-digit organisation numbers before enabling.
companies = [
  "REPLACE_ME_ORGNR_1",
]
events = [
  "annual_accounts",
  "company",
  "roles",
  # Add "group_structure" for group changes.
  # Add "registry_updates" for BRREG's detailed public update stream.
]
[source.filter]
# BRREG already limits results to companies above, so no duplicate filter list is required.
match_all = true
exclude_any = []

# Støtteregisteret må avgrenses. Mottakerlisten kan erstattes eller suppleres
# med provider_orgnrs, industries, regions, from_date eller to_date.
[[source]]
id = "stotte"
kind = "stotte"
label = "Støtteregisteret"
enabled = false
interval_minutes = 360
alert_on_update = true
recipient_orgnrs = ["REPLACE_ME_ORGNR_1"]
page_size = 1000
max_pages = 5
[source.filter]
match_all = true
exclude_any = []

# Følger siste samlede shortposisjon for eksplisitt valgte verdipapirer.
[[source]]
id = "shortsalg"
kind = "finanstilsynet_short_sale"
label = "Finanstilsynets shortsalgregister"
enabled = false
interval_minutes = 360
alert_on_update = true
isins = ["REPLACE_ME_ISIN_1"]
[source.filter]
match_all = true
exclude_any = []

# Krever Actions-secret PATENTSTYRET_API_KEY i den offentlige Watchtower-forken.
[[source]]
id = "patentstyret"
kind = "patentstyret"
label = "Patentstyret"
enabled = false
interval_minutes = 360
alert_on_update = true
companies = ["REPLACE_ME_ORGNR_1"]
kinds = ["Patent", "Trademark", "Design"]
[source.filter]
match_all = true
exclude_any = []

# RSS-profiler bruker URL-er som følger med den offentlige Watchtower-koden.
# Tilgjengelige profiler vises med: python -m watchtower list-rss-profiles
# Sett enabled = true først etter at filteret er tilpasset installasjonens behov.
[[source]]
id = "politiloggen"
kind = "rss"
label = "Politiloggen"
enabled = false
interval_minutes = 15
alert_on_update = true
profiles = ["politiloggen"]
[source.filter]
include_any = ["REPLACE_ME_TOPIC_1"]
exclude_any = []

# SSB overvåker bare eksplisitt valgte tabellnumre og laster ikke ned tallene.
[[source]]
id = "ssb"
kind = "ssb"
label = "Statistisk sentralbyrå"
enabled = false
interval_minutes = 360
alert_on_update = true
tables = ["REPLACE_ME_SSB_TABLE_1"]
[source.filter]
# Tabellisten avgrenser kilden, så alle endringer i disse tabellene er relevante.
match_all = true
exclude_any = []
